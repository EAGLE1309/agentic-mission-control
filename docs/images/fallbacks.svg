<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-label="Three fallback chains that keep a mission going on free services. A model call waits for the rate limiter, then tries the models of its chain in order: the first answers 429, the second makes a bad tool call, and the third answers. A web search tries Linkup, then Exa, then Tavily, and falls back to fetch_url when all three are out. A page read tries Jina Reader, then a direct fetch behind an SSRF guard, then cuts the page into 1,500-character chunks, ranks them with BM25, and sends the top 8,000 characters to the model." font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
  <defs>
    <g id="x">
      <circle r="5.5" fill="none" stroke="#f07470" stroke-width="1.4"/>
      <path d="M-2 -2 2 2M2 -2-2 2" stroke="#f07470" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g id="ok">
      <circle r="5.5" fill="none" stroke="#6bc48e" stroke-width="1.4"/>
      <path d="M-2.4 0.1-0.7 1.8 2.4-1.6" fill="none" stroke="#6bc48e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="idle">
      <circle r="5" fill="none" stroke="#5c5e64" stroke-width="1.4" stroke-dasharray="2 2.2"/>
    </g>
    <g id="arrow">
      <path d="M0 0 H14" stroke="#4a4c52" stroke-width="1.5"/>
      <polygon points="14,-4 21,0 14,4" fill="#4a4c52"/>
    </g>
  </defs>

  <rect width="960" height="372" rx="16" fill="#0c0d0f"/>
  <rect x="0.5" y="0.5" width="959" height="371" rx="15.5" fill="none" stroke="#212226"/>

  <!-- ============ Row 1: a model call ============ -->
  <text x="24" y="66" font-size="13" font-weight="600" fill="#f1f2f3">A model call</text>
  <text x="24" y="84" font-size="11" fill="#9d9fa4">Each agent has a chain</text>
  <text x="24" y="99" font-size="11" fill="#9d9fa4">of free models.</text>

  <g transform="translate(190 52)">
    <rect width="112" height="52" rx="10" fill="#18191c" stroke="#26272b"/>
    <text x="12" y="22" font-size="12" fill="#f1f2f3">Rate limiter</text>
    <text x="12" y="40" font-size="11" fill="#9d9fa4" class="num">18 a minute</text>
  </g>
  <use href="#arrow" x="302" y="78"/>
  <g transform="translate(324 52)">
    <rect width="136" height="52" rx="10" fill="#321a1b" stroke="#5a2a2b"/>
    <text x="12" y="22" font-size="11" fill="#f1f2f3" class="mono">nemotron-3-super</text>
    <use href="#x" x="18" y="36"/>
    <text x="30" y="40" font-size="11" fill="#f07470" class="num">429</text>
  </g>
  <use href="#arrow" x="460" y="78"/>
  <g transform="translate(482 52)">
    <rect width="136" height="52" rx="10" fill="#321a1b" stroke="#5a2a2b"/>
    <text x="12" y="22" font-size="11" fill="#f1f2f3" class="mono">gemma-4-31b</text>
    <use href="#x" x="18" y="36"/>
    <text x="30" y="40" font-size="11" fill="#f07470">bad tool call</text>
  </g>
  <use href="#arrow" x="618" y="78"/>
  <g transform="translate(640 52)">
    <rect width="136" height="52" rx="10" fill="#16291e" stroke="#2d5a3f"/>
    <text x="12" y="22" font-size="11" fill="#f1f2f3" class="mono">inkling</text>
    <use href="#ok" x="18" y="36"/>
    <text x="30" y="40" font-size="11" fill="#6bc48e">answers</text>
  </g>
  <use href="#arrow" x="776" y="78"/>
  <g transform="translate(798 52)">
    <rect width="136" height="52" rx="10" fill="#111215" stroke="#26272b" stroke-dasharray="4 3"/>
    <text x="12" y="22" font-size="11" fill="#9d9fa4" class="mono">openrouter/free</text>
    <use href="#idle" x="18" y="36"/>
    <text x="30" y="40" font-size="11" fill="#7d7f85">the last resort</text>
  </g>

  <line x1="24" y1="136" x2="936" y2="136" stroke="#1c1d20"/>

  <!-- ============ Row 2: web_search ============ -->
  <text x="24" y="182" font-size="13" fill="#f1f2f3" class="mono">web_search</text>
  <text x="24" y="200" font-size="11" fill="#9d9fa4">Three free plans,</text>
  <text x="24" y="215" font-size="11" fill="#9d9fa4">none needs a card.</text>

  <g transform="translate(190 168)">
    <rect width="168" height="52" rx="10" fill="#321a1b" stroke="#5a2a2b"/>
    <text x="12" y="22" font-size="12" fill="#f1f2f3">Linkup</text>
    <text x="156" y="22" font-size="11" fill="#9d9fa4" text-anchor="end" class="num">130 a day</text>
    <use href="#x" x="18" y="36"/>
    <text x="30" y="40" font-size="11" fill="#f07470">out for today</text>
  </g>
  <use href="#arrow" x="358" y="194"/>
  <g transform="translate(382 168)">
    <rect width="168" height="52" rx="10" fill="#16291e" stroke="#2d5a3f"/>
    <text x="12" y="22" font-size="12" fill="#f1f2f3">Exa</text>
    <text x="156" y="22" font-size="11" fill="#9d9fa4" text-anchor="end" class="num">25 a day</text>
    <use href="#ok" x="18" y="36"/>
    <text x="30" y="40" font-size="11" fill="#6bc48e">5 results</text>
  </g>
  <use href="#arrow" x="550" y="194"/>
  <g transform="translate(574 168)">
    <rect width="168" height="52" rx="10" fill="#111215" stroke="#26272b" stroke-dasharray="4 3"/>
    <text x="12" y="22" font-size="12" fill="#9d9fa4">Tavily</text>
    <text x="156" y="22" font-size="11" fill="#7d7f85" text-anchor="end" class="num">30 a day</text>
    <use href="#idle" x="18" y="36"/>
    <text x="30" y="40" font-size="11" fill="#7d7f85">not needed</text>
  </g>
  <use href="#arrow" x="742" y="194"/>
  <g transform="translate(766 168)">
    <rect width="168" height="52" rx="10" fill="#111215" stroke="#26272b" stroke-dasharray="4 3"/>
    <text x="12" y="22" font-size="11" fill="#9d9fa4" class="mono">fetch_url</text>
    <text x="80" y="22" font-size="11" fill="#7d7f85">only</text>
    <use href="#idle" x="18" y="36"/>
    <text x="30" y="40" font-size="11" fill="#7d7f85">when all 3 are out</text>
  </g>

  <line x1="24" y1="252" x2="936" y2="252" stroke="#1c1d20"/>

  <!-- ============ Row 3: fetch_url ============ -->
  <text x="24" y="298" font-size="13" fill="#f1f2f3" class="mono">fetch_url</text>
  <text x="24" y="316" font-size="11" fill="#9d9fa4">Free models have</text>
  <text x="24" y="331" font-size="11" fill="#9d9fa4">small context windows.</text>

  <g transform="translate(190 284)">
    <rect width="112" height="52" rx="10" fill="#321a1b" stroke="#5a2a2b"/>
    <text x="12" y="22" font-size="12" fill="#f1f2f3">Jina Reader</text>
    <use href="#x" x="18" y="36"/>
    <text x="30" y="40" font-size="11" fill="#f07470">timed out</text>
  </g>
  <use href="#arrow" x="302" y="310"/>
  <g transform="translate(324 284)">
    <rect width="136" height="52" rx="10" fill="#16291e" stroke="#2d5a3f"/>
    <text x="12" y="22" font-size="12" fill="#f1f2f3">Direct fetch</text>
    <use href="#ok" x="18" y="36"/>
    <text x="30" y="40" font-size="11" fill="#6bc48e">SSRF guard</text>
  </g>
  <use href="#arrow" x="460" y="310"/>
  <g transform="translate(482 284)">
    <rect width="136" height="52" rx="10" fill="#18191c" stroke="#26272b"/>
    <text x="12" y="22" font-size="12" fill="#f1f2f3">Chunks</text>
    <text x="12" y="40" font-size="11" fill="#9d9fa4" class="num">1,500 chars each</text>
  </g>
  <use href="#arrow" x="618" y="310"/>
  <g transform="translate(640 284)">
    <rect width="136" height="52" rx="10" fill="#18191c" stroke="#26272b"/>
    <text x="12" y="22" font-size="12" fill="#f1f2f3">BM25 rank</text>
    <text x="12" y="40" font-size="11" fill="#9d9fa4">against the focus</text>
  </g>
  <use href="#arrow" x="776" y="310"/>
  <g transform="translate(798 284)">
    <rect width="136" height="52" rx="10" fill="#172338" stroke="#34557f"/>
    <text x="12" y="22" font-size="12" fill="#f1f2f3">To the model</text>
    <text x="12" y="40" font-size="11" fill="#5aa5fa" class="num">top 8,000 chars</text>
  </g>
</svg>
